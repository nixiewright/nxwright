[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nxwright"
version = "0.4.2"
description = "A toolchain for Nextion screens: text source, the nxwright language, tests, and compiling and uploading TFT files."
readme = "README.md"
license = "Apache-2.0 AND OFL-1.1"
license-files = ["LICENSE", "nxwright/project/fonts/OFL.txt"]
requires-python = ">=3.11"
dependencies = [
    # Its wheels carry FreeType itself, 2.13.2 in 2.5.1, whose drawing sets
    # the pixels of every font nxwright draws: a newer one waits until the
    # fonts are checked against the Editor's again (tests/test_font_drawing.py).
    "freetype-py>=2.5.1,<2.6",
    # It reads the version of a Nextion Editor's program, for its firmware,
    # where Windows' own functions are not there (nxwright/tft/firmware.py).
    "pefile>=2024.8.26; sys_platform != 'win32'",
    "pillow>=13.0,<14",
    "pygls>=2.1,<3",
    "pyserial>=3.5",
    "qrcode>=8.2,<9",
    # resvg draws the pictures kept as SVG files (nxwright/source/svg_pictures.py).
    # Another release may draw different pixels, which would change the built
    # projects. Move to a newer one only on purpose, after checking the pictures.
    "resvg-py>=0.5,<0.6",
    "tomli-w>=1.2,<2",
    "zeromcp>=1.10,<2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/nixiewright/nxwright"
Repository = "https://github.com/nixiewright/nxwright"
Issues = "https://github.com/nixiewright/nxwright/issues"

[project.scripts]
nxwright = "nxwright.cli:main"

[tool.setuptools]
# Listed by name, as setuptools ships docs/, a folder outside the package,
# only as a package listed so (nxwright.docs, for nxwright mcp's about tool).
# A new package goes in this list too; tests/test_mcp_server.py checks it.
packages = ["nxwright", "nxwright.debug_adapter", "nxwright.drawing", "nxwright.language",
            "nxwright.language_server", "nxwright.mcp_server", "nxwright.project",
            "nxwright.source", "nxwright.testing", "nxwright.tft", "nxwright.tft.commands",
            "nxwright.tft.component_types", "nxwright.tft.decompiling",
            "nxwright.tft.decompiling.component_types", "nxwright.tft.instructions",
            "nxwright.docs"]

[tool.setuptools.package-dir]
"nxwright.docs" = "docs"

[tool.setuptools.package-data]
"nxwright.project" = ["fonts/NotoSans-Regular.ttf", "fonts/OFL.txt", "memory_costs.toml",
                      "component_defaults.toml", "attribute_descriptions.toml",
                      "attribute_ranges.toml"]
"nxwright.mcp_server" = ["guide.md"]
"nxwright.docs" = ["*.md"]

# The contributors' writing guide, of no use to an agent working on an app.
[tool.setuptools.exclude-package-data]
"nxwright.docs" = ["STYLE.md"]

# The packages nxwright's own tests need. Installing nxwright does not install
# them, but `python -m pip install --group test` does.
[dependency-groups]
test = [
    # The tests pass with these versions. Older ones were not tried.
    "pytest>=9.2",
    "pytest-xdist>=3.8",
]

# pytest runs nxwright's own tests, which are written with unittest.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Both options belong to pytest-xdist, which runs the tests in several
# processes. `-n auto` uses every processor, unless you pass another `-n` on
# the command line. `--dist loadfile` keeps the tests of a file in one
# process, so that the setup of a class or of a module runs only once.
addopts = "-n auto --dist loadfile"
# Both lists are empty so that pytest runs only the unittest test classes.
# By default, it would also treat a helper function whose name begins with
# test_, or a helper class whose name begins with Test, as a test.
python_functions = []
python_classes = []
# The filter keeps one deprecation warning out of pytest's summary, where
# hundreds of copies of it would hide any other warning. Each time the
# language server handles a request, pygls 2.1.1 calls a function that
# Python 3.14 deprecates, and nothing in nxwright can change that call.
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:pygls.protocol.json_rpc",
]
