<?xml-stylesheet href="../css/theme.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6" height="40" class="on">
<!-- The schedule's mark beside the selected period, on the card's colour. -->
<defs>
  <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff9a4d"/>
    <stop offset="1" stop-color="#ff5a3c"/>
  </linearGradient>
</defs>
<g id="marker">
<rect width="6" height="40" fill="#161b23"/>
<rect class="only-on" width="6" height="40" rx="3" fill="url(#heat)"/>
</g>
</svg>
