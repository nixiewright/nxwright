<?xml-stylesheet href="css/theme.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
<!-- The demo's logo, on the card's colour: a dial around a flame. It is the
     picture the blank project starts with, so it must look different when
     turned: nxwright learns the screen's pixel order from it. -->
<defs>
  <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff9a4d"/>
    <stop offset="1" stop-color="#ff5a3c"/>
  </linearGradient>
</defs>
<g id="logo">
<rect width="64" height="64" fill="#161b23"/>
<rect x="2" y="2" width="60" height="60" rx="16" fill="url(#heat)"/>
<path d="M21.4 43.6 A15 15 0 1 1 42.6 43.6" fill="none" stroke="#ffffff" stroke-opacity="0.9"
      stroke-width="3.5" stroke-linecap="round"/>
<use href="shapes.svg#i-flame" x="23" y="21" width="18" height="18" fill="#ffffff"/>
<circle cx="42.6" cy="43.6" r="3" fill="#ffffff"/>
</g>
</svg>
