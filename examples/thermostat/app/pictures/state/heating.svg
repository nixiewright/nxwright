<?xml-stylesheet href="../css/theme.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" class="heating">
<!-- The home page's state icon, on the card's colour: heating, cooling,
     at the target, or off. -->
<defs>
  <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff9a4d"/>
    <stop offset="1" stop-color="#ff5a3c"/>
  </linearGradient>
</defs>
<g id="state">
<rect width="28" height="28" fill="#161b23"/>
<use class="only-heating" href="../shapes.svg#i-flame" x="1" y="1" width="26" height="26" fill="url(#heat)"/>
<use href="../shapes.svg#i-snowflake" class="icon only-cooling" x="1" y="1" width="26" height="26" style="color: #4cb6ff"/>
<use href="../shapes.svg#i-check" class="icon only-idle" x="1" y="1" width="26" height="26" style="color: #3fd6b0"/>
<use href="../shapes.svg#i-power" class="icon only-off" x="1" y="1" width="26" height="26" style="color: #7a8596"/>
</g>
</svg>
