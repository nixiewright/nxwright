name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # The oldest Python that nxwright supports catches code that needs a
        # newer one. The newest catches code that relies on something Python
        # has removed. A version between them is unlikely to find a problem
        # that these two miss.
        python: ["3.11", "3.14"]
        # macOS runners are scarce. When none was free, GitHub has cancelled
        # every macOS job of the run. So macOS runs only the newest Python.
        exclude:
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: nxwright's dependencies, from pyproject.toml
        run: python -m pip install .
      - name: nxwright's tests
        run: python -m unittest discover -s tests -t .
      - name: The demo's tests
        run: python run.py test examples/thermostat/tests
      # The tool drives the Nextion Editor, a Windows program, and its tests
      # need Windows too (tools/editor/README.md). Most need none of the tool's
      # packages, but the tests of its open and tft commands import the tool,
      # and so pywinauto.
      - name: The Editor automation tool's packages
        if: runner.os == 'Windows'
        run: python -m pip install -r tools/editor/requirements.txt
      - name: The Editor automation tool's tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tools/editor/tests -t .

  extension:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the VS Code extension's client
        run: |
          npm ci
          npm run compile
      - name: Test the page preview's painting
        run: npm test

  # The tests inside VS Code (`npm run test:host`). Contributors run them on
  # Windows (CONTRIBUTING.md). Here they run on Linux and macOS, where
  # nothing else tries the client's code that needs VS Code, such as the
  # folder of the agent channel's files, which depends on the system.
  extension-host:
    runs-on: ${{ matrix.os }}
    # A VS Code that hangs would otherwise hold the runner for hours.
    timeout-minutes: 30
    env:
      # The VS Code the tests run in, pinned so that a new VS Code release
      # cannot change a run's result on its own. Raise it by hand.
      VSCODE_VERSION: "1.139.1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The tests run this checkout's nxwright, with `python`, for the
      # language server (test/host/run.mjs).
      - name: nxwright's dependencies, from pyproject.toml
        working-directory: .
        run: python -m pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The VS Code extension's packages
        run: npm ci
      # The download of that version is kept between runs, so that a run
      # downloads VS Code only when the version changes, or the cache was
      # dropped after a week unused.
      - name: The VS Code download, kept from an earlier run
        uses: actions/cache@v4
        with:
          path: editors/vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ env.VSCODE_VERSION }}
      # run.mjs never downloads VS Code: it runs the one NXWRIGHT_TEST_VSCODE
      # names. So this step downloads one first, into .vscode-test/, apart
      # from any other, and names its program. It downloads nothing when the
      # cache gave that version back.
      - name: A VS Code installed apart, for the tests
        run: >-
          node --input-type=module -e "import { appendFileSync } from 'node:fs';
          import { downloadAndUnzipVSCode } from '@vscode/test-electron';
          const program = await downloadAndUnzipVSCode(process.env.VSCODE_VERSION);
          appendFileSync(process.env.GITHUB_ENV, 'NXWRIGHT_TEST_VSCODE=' + program + '\n');"
      # VS Code needs a display, which a Linux runner has none of.
      - name: The tests inside VS Code, with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - name: The tests inside VS Code
        if: runner.os != 'Linux'
        run: npm run test:host
