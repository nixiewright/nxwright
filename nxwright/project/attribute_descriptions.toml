# What each attribute of each component type is, in nxwright's own words, for
# the language server's hovers, completion, and the Properties section
# (attribute_descriptions.py). Written by hand, from what the Editor's
# Attribute panel shows of each attribute and what nxwright does with it;
# never copied from the Editor's hints, which are not nxwright's to publish.
#
# A table per type, named as component_defaults.toml names types, and a table
# common, for an attribute that means the same on every type having it. A
# type's own entry replaces the common one. Each entry has a description; the
# choices of an attribute whose value is one of a few numbers; code_can_change,
# whether code may change it, which the Editor shows by its name's colour
# (where the Editor never showed it, true unless its compile refused an
# assignment); where it is not shown with a field to edit, properties:
# "value-only", "hidden", or "never-shown"; and, for a method, which code
# calls rather than sets, as d0.insert("a^b"), method = true.
#
# What the screen keeps of a number code stores, as the Nextion Editor's
# simulator kept it: code_range = [lowest, highest], where a number outside
# is refused; or code_wraps, "u8", "u16", or "s16", where any number is cut
# to that many bytes, unsigned or signed. With neither, it keeps any number.
# A type's entry of only code_range or code_wraps adds it to the common
# entry, keeping the common words.

[common.vscope]
description = "Whether the component's values last beyond its page. A local component starts again from the page file each time its page opens; a global one keeps its values from page to page, and code on other pages can reach it."
choices = { 0 = "local", 1 = "global" }
code_can_change = false

[common.lockobj]
description = "Whether the component is locked. A locked component shows a padlock at its top right corner, in the page preview as in the Nextion Editor's design view. The preview then keeps it from being moved by dragging, the arrow keys, or arranging. The Nextion Editor's panel never shows it; its Lock and Unlock commands are taken to set it."
choices = { 0 = "unlocked", 1 = "locked" }
code_can_change = true
properties = "never-shown"

[common.groupid0]
description = "With groupid1, the component's group, in the page preview and in the Nextion Editor's design view. The components of a page that share both, groupid0 not 0, are one group: selecting a member tints them all, and moving one moves them all. 0 is no group. The preview's Group gives the smallest groupid0 the page does not use, and groupid1 0. The Nextion Editor's Create Group gives a new group two large numbers. The Nextion Editor's panel never shows it."
code_can_change = true
properties = "never-shown"

[common.groupid1]
description = "With groupid0, the component's group, in the page preview and in the Nextion Editor's design view (see groupid0). With groupid0 0, it makes no group. The Nextion Editor's panel never shows it."
code_can_change = true
properties = "never-shown"

[common.path_m]
description = "The most bytes `path` holds. The build refuses a longer one, and code storing a longer one keeps its first bytes."
code_can_change = true
properties = "value-only"

[common.loop]
description = "Whether playing starts again from the beginning when it ends. Without it, the last frame stays, and `en` becomes 0."
choices = { 0 = "no", 1 = "yes" }
code_can_change = true
code_range = [0, 1]

[common.stim]
description = "How long the whole file plays, in milliseconds, which the file sets."
code_can_change = false

[common.molloc_s]
description = "The Nextion Editor's panel never shows it, and its use is not known. By its name, it may be memory the component takes, but no memory is counted for it, and a video plays even with it set below one frame."
code_can_change = true
properties = "never-shown"

[common.molloc]
description = "The Nextion Editor's panel never shows it, and its use is not known. By its name, it may be memory the component takes, but no memory is counted for it, and a video plays even with it set below one frame."
code_can_change = true
properties = "never-shown"

[common.drag]
description = "Whether a touch can drag the component across the screen. The Basic, Enhanced, and Discovery series refuse code that sets it."
choices = { 0 = "no", 1 = "yes" }
code_can_change = true
code_range = [0, 1]

[common.sendkey]
description = "Whether the screen sends the component's ID when it is touched: as it is pressed, as it is released, or both. It sends 0x65, the page's ID, the component's ID, and 1 for a press or 0 for a release, then FF FF FF. In the Nextion Editor, it is the \"Send Component ID\" ticks of the Touch Press and Touch Release events."
choices = { 0 = "none", 1 = "release", 2 = "press", 3 = "both" }
code_can_change = true

[common.aph]
description = "How opaque the component is drawn, from 0, not drawn at all, to 127, fully opaque. Each part is blended in turn over what lies under it: a text's background, then its words. The Basic, Enhanced, and Discovery series refuse code that sets it."
code_can_change = true
code_range = [0, 127]

[common.movex]
description = "The Nextion Editor's panel never shows it, and its use is not known. 0 by default. On the Edge and Intelligent series, code reading it reads 0, even while `move` moves the component. The Basic, Enhanced, and Discovery series refuse code naming it at all."
code_can_change = false
properties = "never-shown"

[common.movey]
description = "The Nextion Editor's panel never shows it, and its use is not known. 0 by default. On the Edge and Intelligent series, code reading it reads 0, even while `move` moves the component. The Basic, Enhanced, and Discovery series refuse code naming it at all."
code_can_change = false
properties = "never-shown"

[common.x]
description = "How far the component's left edge is from the page's, in pixels. The Basic, Enhanced, and Discovery series refuse code that sets it."
code_can_change = true
code_range = [-6000, 6000]

[common.y]
description = "How far the component's top edge is from the page's, in pixels. The Basic, Enhanced, and Discovery series refuse code that sets it."
code_can_change = true
code_range = [-6000, 6000]

[common.w]
description = "The component's width, in pixels."
code_can_change = false

[common.h]
description = "The component's height, in pixels."
code_can_change = false

[common.effect]
description = "How the component comes into view as its page opens: at once, or sliding in from an edge or a corner of the screen. On the Basic, Enhanced, and Discovery series, code cannot set it, and the simulator shows the component at once."
choices = { 0 = "at once", 1 = "from the top", 2 = "from the bottom", 3 = "from the left", 4 = "from the right", 5 = "from the top left", 6 = "from the top right", 7 = "from the bottom left", 8 = "from the bottom right" }
code_can_change = true
code_range = [0, 8]

[common.first]
description = "The order in which the components' effects run as the page opens: a higher number runs sooner. At most 100. The Basic, Enhanced, and Discovery series refuse code that sets it."
code_can_change = true

[common.time]
description = "How long the component's effect takes as the page opens, in milliseconds, from 150 to 65535. The Basic, Enhanced, and Discovery series refuse code that sets it."
code_can_change = true

[common.sta]
description = "What fills the component's background. The Basic, Enhanced, and Discovery series refuse 3."
choices = { 0 = "a crop of a picture", 1 = "a colour", 2 = "a picture", 3 = "nothing, so the page shows through" }
code_can_change = false

[common.style]
description = "How the component's edge is drawn."
choices = { 0 = "flat", 1 = "a border", 2 = "sunken", 3 = "raised" }
code_can_change = false

[common.borderc]
description = "The border's colour, when the style draws a border. The Basic, Enhanced, and Discovery series refuse code that sets it on a button, a dual-state button, or a text."
code_can_change = true

[common.borderw]
description = "The border's width in pixels, from 0 to 255, when the style draws a border. The Basic, Enhanced, and Discovery series refuse code that sets it on a button, a dual-state button, or a text."
code_can_change = true

[common.font]
description = "The font of the component's text, by its ID among the project's fonts."
code_can_change = true

[common.pic]
description = "The picture drawn as the background, when the background is a picture."
code_can_change = true

[common.picc]
description = "The picture a part of which shows as the background, when the background is a crop of a picture: the part behind the component. The picture must be as large as the screen."
code_can_change = true

[common.bco]
description = "The background's colour, when the background is a colour."
code_can_change = true
code_range = [0, 65535]

[common.pco]
description = "The text's colour."
code_can_change = true
code_range = [0, 65535]

[common.xcen]
description = "Where the text sits across the component."
choices = { 0 = "left", 1 = "centre", 2 = "right" }
code_can_change = true
code_range = [0, 2]

[common.ycen]
description = "Where the text sits up and down the component."
choices = { 0 = "top", 1 = "middle", 2 = "bottom" }
code_can_change = true
code_range = [0, 2]

[common.txt_maxl]
description = "The most bytes `txt` can hold, which the screen sets aside in its memory."
code_can_change = false

[common.isbr]
description = "Whether a text too long for a line goes on to the next."
choices = { 0 = "no", 1 = "yes" }
code_can_change = true
code_range = [0, 1]

[common.spax]
description = "Space added between characters, in pixels, from 0 to 255. The Basic, Enhanced, and Discovery series refuse code that sets it on a button, a dual-state button, or a text."
code_can_change = true
code_range = [0, 255]

[common.spay]
description = "Space added between lines, in pixels, from 0 to 255. The Basic, Enhanced, and Discovery series refuse code that sets it on a button, a dual-state button, or a text."
code_can_change = true
code_range = [0, 255]

[common.format_m]
description = "The most bytes code can store in `format`: it keeps the first bytes of a longer one. A longer one in the page file is kept whole, and the screen shows all of it."
code_can_change = true
properties = "value-only"

[common.dir_m]
description = "The most bytes `dir` holds. The build refuses a longer one, and code storing a longer one keeps its first bytes."
code_can_change = true
properties = "value-only"

[common.autoleft]
description = "The Nextion Editor's panel never shows it, and its use is not known. A data record and a file browser have it. 0 by default; 1 changes nothing seen. Code can read it."
code_can_change = false
properties = "never-shown"

[common.left]
description = "Whether a scroll bar shows."
choices = { 0 = "never", 1 = "while scrolling", 2 = "always" }
code_can_change = true
code_range = [0, 2]

[common.filter_m]
description = "The most bytes `filter` holds. The build refuses a longer one, and code storing a longer one keeps its first bytes."
code_can_change = true
properties = "value-only"

[common.txt_m]
description = "The most bytes `txt` holds. The build refuses a longer one."
code_can_change = true
properties = "value-only"

[common.maxval_y]
description = "How far the content can scroll down, which the screen works out from the content as it runs. Code can read it but not set it."
code_can_change = false

[common.val_y]
description = "How far the content is scrolled down, from 0 to `maxval_y`."
code_can_change = true

[common.vvs2_m]
description = "The most bytes `vvs2` holds. The build refuses a longer one, and code storing a longer one keeps its first bytes."
code_can_change = true
properties = "value-only"

[common.key]
description = "The keyboard that opens when the component is touched, so that it can be typed in, or 255 for none."
code_can_change = false

[audio.from]
description = "Where the file played comes from."
choices = { 0 = "the project", 1 = "a file on the screen" }
code_can_change = false

[audio.vid]
description = "The sound played, by its ID among the project's sounds, when it comes from the project. Code setting another plays it from its start. Code setting the one playing changes nothing."
