[combo-box.dis]
description = "How round the corners of the box, its items, and its scroll marks are, as a percentage of half their shorter side, from 0, square, to 100. A border or a 3D style draws the box square."
code_can_change = true
code_range = [0, 100]

[combo-box.txt]
