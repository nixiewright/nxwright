[audio.path]
description = "The file played when it comes from the screen, as a path such as \"sd0/1.wav\". Code may name it only while `from` is 1. Code setting it plays the file from its start, even the file playing."
code_can_change = true

[audio.path_m]
description = "The most bytes `path` holds: code storing a longer one keeps its first bytes. While `from` is 1, the build refuses a longer one; while it is 0, it takes one."
code_can_change = true
properties = "value-only"

[audio.en]
description = "Whether it plays: 1 plays, 2 pauses where it is, and 0 stops it, back at its beginning. It becomes 0 when playing that does not loop ends."
choices = { 0 = "stopped", 1 = "playing", 2 = "paused" }
code_can_change = true
code_wraps = "u8"

[audio.dis]
description = "The Nextion Editor's panel never shows it, and its use is not known. Unlike a video's `dis`, it does not change the sound's speed."
code_can_change = true
code_wraps = "u16"
properties = "never-shown"

[audio.fps]
description = "The Nextion Editor's panel never shows it, and its use is not known. It does not change the sound's speed."
code_can_change = false
properties = "never-shown"

[audio.tim]
description = "How far the playing has gone, in milliseconds, from 0 at each start. Code setting it moves the playing there."
code_can_change = true

[audio.qty]
description = "The Nextion Editor's panel never shows it, and its use is not known. It does not change the sound's speed."
code_can_change = false
properties = "never-shown"

[button.style]
description = "How the button's edge is drawn."
