[switch.pco1]
description = "The text's colour."
code_can_change = true
code_range = [0, 65535]

[switch.dis]
description = "How round the outer corners are, as a percentage, from 0, square, to 100."
code_can_change = true
code_range = [0, 100]

[switch.txt]
description = "The words shown, at most 24 characters, split at the first \"/\": the first while the switch is off, the second while it is on, as \"False/True\"."
code_can_change = true

[switch.txt_maxl]
description = "The Nextion Editor's panel never shows it for a switch, and its use there is not known. 24 by default. Code can read it."
code_can_change = false
properties = "never-shown"

[text.pw]
description = "Whether the text shows as typed, or as stars, as a password does."
choices = { 0 = "as typed", 1 = "as stars" }
code_can_change = true
code_range = [0, 1]

[text.txt]
description = "The text shown."
code_can_change = true

[timer.tim]
description = "The time between two timer events, in milliseconds, from 50 to 65535."
code_can_change = true

[timer.en]
description = "Whether the timer runs."
choices = { 0 = "no", 1 = "yes" }
code_can_change = true

[touch-capture.val]
description = "The ID of the component the last touch landed on, 0 for the page. It is set as a touch begins and as it ends, before the touch capture's events run, which run before the component's own."
code_can_change = false

[variable.sta]
description = "What the variable holds."
choices = { 0 = "a number", 1 = "a text" }
code_can_change = false

[variable.txt]
description = "The text the variable starts with, when it holds a text."
code_can_change = true

[variable.val]
description = "The number the variable starts with, a whole number from -2147483648 to 2147483647, when it holds a number."
code_can_change = true

[video.from]
description = "Where the file played comes from."
choices = { 0 = "the project", 1 = "a file on the screen" }
code_can_change = false

[video.vid]
description = "The video played, by its ID among the project's videos, when it comes from the project. Code may name it only while `from` is 0. Code setting another plays it from its start. Code setting the one playing changes nothing."
code_can_change = true

[video.path]
description = "The file played when it comes from the screen, as a path such as \"sd0/1.video\". Code may name it only while `from` is 1. Code setting it plays the file from its start, even the file playing."
code_can_change = true

[video.path_m]
description = "The most bytes `path` holds: code storing a longer one keeps its first bytes. While `from` is 1, the build refuses a longer one; while it is 0, it takes one."
code_can_change = true
properties = "value-only"

[video.en]
description = "Whether it plays: 1 plays, 2 pauses where it is, and 0 stops it, back at its beginning, its first frame showing. It becomes 0 when playing that does not loop ends."
choices = { 0 = "stopped", 1 = "playing", 2 = "paused" }
code_can_change = true
code_wraps = "u8"

[video.dis]
description = "The speed of playing, as a percentage. The Nextion Editor's panel gives its range as 10 to 1000, but code may set it lower or higher, and it plays that fast."
code_can_change = true
code_wraps = "u16"

[video.tim]
description = "How far the playing has gone, in milliseconds, from 0 at each start. Code setting it moves the playing there."
code_can_change = true

[video.qty]
description = "How many frames the video has, which its file sets."
code_can_change = false

[video.fps]
description = "How many frames a second the video plays. It comes from the video's file."
code_can_change = false
properties = "value-only"

[waveform.dir]
description = "Which way the curves move."
choices = { 0 = "left to right", 1 = "right to left", 2 = "kept to the right" }
code_can_change = false

[waveform.ch]
description = "How many channels the waveform draws."
choices = { 1 = "one", 2 = "two", 3 = "three", 4 = "four" }
code_can_change = false

[waveform.gdc]
description = "The grid's colour."
code_can_change = true
code_range = [0, 65535]

[waveform.gdw]
description = "The width of the grid's cells, in pixels: 0 draws no lines up and down."
code_can_change = true
code_range = [0, 255]

[waveform.gdh]
description = "The height of the grid's cells, in pixels: 0 draws no lines across."
code_can_change = true
code_range = [0, 255]

[waveform.objWid]
description = "The Nextion Editor's panel never shows it, and its use is not known. 0 by default. Code reading it reads 0, though a typed `get` of it answers 0x1A, an invalid variable."
code_can_change = false
properties = "never-shown"

[waveform.objHig]
description = "The Nextion Editor's panel never shows it, and its use is not known. 0 by default. Code reading it reads 0, though a typed `get` of it answers 0x1A, an invalid variable."
code_can_change = false
properties = "never-shown"

[waveform.pco0]
description = "Channel 0's colour."
code_can_change = true
code_range = [0, 65535]

[waveform.pco1]
description = "Channel 1's colour."
code_can_change = true

[waveform.pco2]
description = "Channel 2's colour."
code_can_change = true

[waveform.pco3]
description = "Channel 3's colour."
code_can_change = true

[waveform.inittrue]
description = "The Nextion Editor's panel never shows it, and its use is not known. 0 by default. Code reading it reads 0, though a typed `get` of it answers 0x1A, an invalid variable."
code_can_change = false
properties = "never-shown"

[waveform.dis]
description = "How the channels' values are scaled, as a percentage, from 10 to 1000."
code_can_change = true
code_range = [10, 1000]

[xfloat.val]
description = "The number shown, as a whole number from -2147483648 to 2147483647, which `vvs0` and `vvs1` place the decimal point in."
code_can_change = true

[xfloat.vvs0]
description = "How many digits show before the decimal point: fewer are padded with zeros on the left, more cut to the first ones. 0 shows as many as it needs."
code_can_change = true
code_range = [0, 10]

[xfloat.vvs1]
description = "How many digits show after the decimal point: `val` is the number times 10 to this power. 0 shows no point."
code_can_change = true
code_range = [0, 8]
