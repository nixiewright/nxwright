code_can_change = true
code_wraps = "s16"

[crop.vvs1]
description = "Where the crop's picture starts down: the crop shows the part of `picc` this many pixels below its own `y`, nothing where that passes the picture's edge. Code setting it draws the crop again at once. 0 by default. The Nextion Editor's panel never shows it. The Basic, Enhanced, and Discovery series refuse code that sets it."
code_can_change = true
code_wraps = "s16"

[data-record.init]
description = "The Nextion Editor's panel never shows it. 0 by default. At 1, set in the page file, the data record does not open its data file: it shows its titles and no records, makes no missing file, and lets another data record open the file. Its methods change nothing, and send no error code. Once code sets its path, even to the same file, it works as at 0. Not seen: a data record of local scope, whose path goes back to the page file's as its page opens again; nxwright's simulator then opens the file, as code set its path once."
code_can_change = false
properties = "value-only"

[data-record.path]
description = "The data file the records are kept in, as a path such as \"sd0/1.data\"."
code_can_change = true

[data-record.lenth]
description = "The most bytes each record of the data file holds."
code_can_change = false

[data-record.maxval]
description = "The most records the data file keeps: a newer record then replaces the oldest."
code_can_change = false

[data-record.dez]
description = "How many fields each record of the data file has, from 1 to 12."
code_can_change = false

[data-record.format]
description = "The columns' widths, separated by `^`, such as \"100^100\". Without them, the columns share the table's width; wider, the table scrolls across."
code_can_change = true

[data-record.dir]
description = "The columns' titles, separated by `^`. Without them, the top record takes the titles' row, in `pco`."
code_can_change = true

[data-record.dir_m]
description = "The most bytes code can store in `dir`: it keeps the first bytes of a longer one. A longer one in the page file is kept whole, and the screen shows all of it."
code_can_change = true
properties = "value-only"

[data-record.mode]
description = "Whether the data file is made when its path finds none."
choices = { 0 = "no", 1 = "yes" }
code_can_change = true
code_range = [0, 1]

[data-record.dis]
description = "Whether touching a record chooses it."
choices = { 0 = "no", 1 = "yes" }
code_can_change = true
code_range = [0, 1]

[data-record.order]
description = "Where new records show in the table: at the top, the newest first, or at the bottom."
