# The values the Nextion Editor's compile takes for an attribute of a page or
# a component, where it takes fewer than the attribute's bytes can store. The
# Nextion Editor 1.68.2 refused a value outside as it compiled ("Out of
# range"), so the build refuses it too (attribute_ranges.py).
#
# Each range is the attribute's entry in the TFT file the Nextion Editor
# writes: its lowest, then its highest. A range is kept here only where the
# Nextion Editor was seen to refuse a value past it. The IDs of pictures,
# fonts, and the resource a vid plays are left out. The Nextion Editor
# compiles a picture's ID past the project's last picture.
#
# A table per type, named as component_defaults.toml names types, and a
# table common, for an attribute with the same range on every type that has
# it. A range is [lowest, highest] on every series, or a table of ranges by
# series, T, K, F, P, and E, for one that differs by series or is checked on
# some series alone. A vscope of 2, for one, compiled on most types of the
# Basic, Enhanced, and Discovery series, and was refused on every type of the
# Intelligent and Edge series.

